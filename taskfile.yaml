version: '3'
tasks:
  run:
    desc: run the API SERVER
    cmds:
      - ./bin/api.exe

  build:
    desc: build binary file
    cmds:
      - go build -o bin/api.exe ./cmd/api

  migrate-up:
    desc: migrate up
    cmds:
      - go run ./cmd/migrate up

  migrate-down:
    desc: migrate down
    cmds:
      - go run ./cmd/migrate down

  merchant-dev:
    desc: run merchant frontend dev server (port 5173)
    cmds:
      - cd frontend-merchant && npm run dev

  customer-dev:
    desc: run customer frontend dev server (port 5174)
    cmds:
      - cd frontend-customer && npm run dev

  merchant-build:
    desc: build merchant frontend
    cmds:
      - cd frontend-merchant && npm run build

  customer-build:
    desc: build customer frontend
    cmds:
      - cd frontend-customer && npm run build